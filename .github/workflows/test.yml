name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test local ledger and timer behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check manifest and translation catalogs
        run: |
          python3 -m json.tool manifest.json > /dev/null
          python3 -m json.tool i18n/en.json > /dev/null
          python3 -m json.tool i18n/pt.json > /dev/null
